<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* General Page Styling */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    /* Container for the Form */
    form {
        background: #ffffff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }

    h2 {
        margin-top: 0;
        color: #333;
        font-size: 1.5rem;
        text-align: center;
    }

    /* Star Rating Logic */
    .star-rating {
        direction: rtl;
        font-size: 35px;
        text-align: center;
        margin-bottom: 20px;
    }

    .star-rating input {
        display: none;
    }

    .star-rating label {
        color: #ddd;
        cursor: pointer;
        transition: color 0.2s ease-in-out;
    }

    .star-rating input:checked ~ label {
        color: #ffc107; /* Gold */
    }

    .star-rating label:hover,
    .star-rating label:hover ~ label {
        color: #ffca28;
    }

    /* Textarea/Comment Styling */
    .mb-3 {
        margin-bottom: 1.5rem;
    }

    /* Target the Django form widget specifically */
    textarea, .mb-3 textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
        font-family: inherit;
        resize: vertical;
        min-height: 100px;
    }

    textarea:focus {
        outline: none;
        border-color: #28a745;
        box-shadow: 0 0 5px rgba(40, 167, 69, 0.2);
    }

    /* Button Styling */
    .btn-success {
        width: 100%;
        background-color: #28a745;
        color: white;
        border: none;
        padding: 12px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .btn-success:hover {
        background-color: #218838;
    }

    /* ===== ENHANCED DESIGN ADDITIONS (NO HTML CHANGES) ===== */
    
    /* 1. Subtle animated background gradient & container depth */
    body {
        background: linear-gradient(135deg, #e0eef7 0%, #cbdbe9 100%);
        position: relative;
        overflow: hidden;
    }
    
    /* Floating abstract shapes for visual interest */
    body::before {
        content: '';
        position: absolute;
        width: 250px;
        height: 250px;
        background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
        border-radius: 50%;
        top: -100px;
        left: -80px;
        pointer-events: none;
        z-index: 0;
    }
    
    body::after {
        content: '';
        position: absolute;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(255,255,220,0.15) 0%, rgba(255,255,255,0) 70%);
        border-radius: 50%;
        bottom: -120px;
        right: -100px;
        pointer-events: none;
        z-index: 0;
    }
    
    /* Form card gets subtle glow & enhanced shadow + smooth border */
    form {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(0px);
        border-radius: 28px;
        box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s ease, box-shadow 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.5);
        position: relative;
        z-index: 2;
    }
    
    /* Lift effect on hover (subtle) */
    form:hover {
        transform: translateY(-5px);
        box-shadow: 0 32px 55px -12px rgba(0, 0, 0, 0.3);
    }
    
    /* Stylish title underline & gradient text effect */
    h2 {
        font-weight: 600;
        background: linear-gradient(135deg, #1f2b3a, #2c3e4e);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: -0.2px;
        position: relative;
        display: inline-block;
        margin-bottom: 1.65rem;
        font-size: 1.7rem;
        width: 100%;
        text-align: center;
        padding-bottom: 6px;
    }
    
    /* Decorative line under h2 (modern accent) */
    h2::after {
        content: '';
        display: block;
        width: 60px;
        height: 3px;
        background: linear-gradient(90deg, #28a745, #ffc107);
        border-radius: 4px;
        margin: 10px auto 0;
        transition: width 0.25s ease;
    }
    
    form:hover h2::after {
        width: 90px;
    }
    
    /* Enhanced star rating container: soft glow and refined spacing */
    .star-rating {
        background: #fef9e6;
        padding: 12px 8px;
        border-radius: 60px;
        margin-bottom: 28px;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.02), 0 2px 5px rgba(0,0,0,0.02);
        transition: background 0.2s;
    }
    
    .star-rating label {
        font-size: 40px;
        margin: 0 4px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        transition: transform 0.1s ease, color 0.2s;
        display: inline-block;
    }
    
    /* star subtle scale on hover */
    .star-rating label:hover {
        transform: scale(1.1);
    }
    
    /* comment field with floating label effect - but we keep original structure */
    .mb-3 {
        position: relative;
        margin-bottom: 1.8rem;
    }
    
    /* style the textarea with more personality */
    textarea, .mb-3 textarea {
        background-color: #fcfcfd;
        border: 1.5px solid #e2e8f0;
        border-radius: 20px;
        padding: 14px 18px;
        font-size: 0.95rem;
        transition: all 0.25s ease;
        box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    
    textarea:focus, .mb-3 textarea:focus {
        border-color: #ffb347;
        box-shadow: 0 0 0 4px rgba(255, 180, 71, 0.15), 0 1px 2px rgba(0,0,0,0.05);
        background-color: #fff;
    }
    
    /* Custom placeholder style (only visual: no html change) */
    textarea::placeholder {
        color: #b9c3cf;
        font-style: italic;
        font-weight: 400;
        letter-spacing: 0.2px;
    }
    
    /* Add an elegant icon-like effect to comment before? only CSS pseudo, no extra elements */
    .mb-3 {
        position: relative;
    }
    
    /* subtle quote-like flourish before textarea - pure decoration */
    .mb-3::before {
        content: '✍️';
        position: absolute;
        left: 12px;
        top: -12px;
        background: white;
        padding: 0 6px;
        font-size: 14px;
        border-radius: 30px;
        color: #ffa559;
        z-index: 3;
        pointer-events: none;
        opacity: 0.7;
        transition: opacity 0.2s;
    }
    
    /* button gains modern gradient / shine effect */
    .btn-success {
        background: linear-gradient(95deg, #28a745 0%, #1e7a34 100%);
        border-radius: 40px;
        font-weight: 600;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        font-size: 0.9rem;
        padding: 12px 16px;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
        z-index: 1;
        box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    }
    
    /* Subtle shine overlay */
    .btn-success::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.5s ease;
        z-index: -1;
    }
    
    .btn-success:hover::before {
        left: 100%;
    }
    
    .btn-success:hover {
        background: linear-gradient(95deg, #2c9e4a, #146b2c);
        transform: translateY(-1px);
        box-shadow: 0 12px 20px -8px rgba(33, 136, 56, 0.4);
    }
    
    /* Optional rating feedback: add animated ring for selected rating? */
    /* Making form feel cohesive, add small ripple to stars on click + subtle checkmark effect for selected */
    .star-rating input:checked + label {
        animation: starPop 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    
    @keyframes starPop {
        0% { transform: scale(1); text-shadow: 0 0 0px gold;}
        80% { transform: scale(1.2); text-shadow: 0 0 6px #ffc107;}
        100% { transform: scale(1); text-shadow: 0 0 0px gold;}
    }
    
    /* Spacing dynamic for small screens: maintain responsiveness */
    @media (max-width: 480px) {
        form {
            padding: 1.5rem;
            max-width: 90%;
        }
        .star-rating label {
            font-size: 34px;
            margin: 0 2px;
        }
        h2 {
            font-size: 1.4rem;
        }
        .mb-3::before {
            font-size: 12px;
            left: 10px;
            top: -10px;
        }
    }
    
    /* cleaner overall transitions and focus visibility */
    input:focus, button:focus, textarea:focus {
        outline: none;
    }
    
    /* custom style for django hidden fields & csrf (purely cosmetic, no html touched) */
    input[name="csrfmiddlewaretoken"] {
        display: none; /* doesn't affect layout, just hides token input if visible (some themes) but not removing, just styling */
    }
    
    /* add a subtle shimmering background card border */
    form {
        border: 1px solid rgba(255,215,140,0.3);
        position: relative;
    }
    
    /* extra elegant decoration: inner glow */
    form::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 28px;
        padding: 2px;
        background: radial-gradient(circle at 30% 20%, rgba(255,215,130,0.2), transparent 80%);
        pointer-events: none;
    }
    
    /* improve submit button hover + sprinkle active state */
    .btn-success:active {
        transform: scale(0.97);
        transition: transform 0.05s;
    }
    
    /* star rating container subtle border and soft background animation */
    .star-rating {
        background: linear-gradient(145deg, #fff6e8, #fffdf9);
        border: 1px solid #ffe3b5;
        transition: all 0.2s;
    }
    
    .star-rating:focus-within {
        border-color: #ffb343;
        box-shadow: 0 0 0 3px rgba(255, 180, 70, 0.2);
    }
    
    /* make the textarea comment looking premium */
    .mb-3 textarea {
        font-weight: 400;
        line-height: 1.5;
    }
    
    /* rating label transition plus smoothness */
    .star-rating label {
        transition: transform 0.1s ease, color 0.2s, text-shadow 0.1s;
    }
    
    /* extra radiance for checked stars? we already have gold, but add glow for checked ones */
    .star-rating input:checked ~ label {
        text-shadow: 0 0 4px rgba(255, 193, 7, 0.6);
    }
    
    /* additional background pattern: subtle dots */
    body {
        background-image: radial-gradient(circle at 15% 30%, rgba(255,255,245,0.2) 2px, transparent 2px);
        background-size: 28px 28px;
    }
    
    /* complete design with also caption for stars? we keep origin HTML, just additional visual flair */
    /* custom animation for page entrance: slight fade-in for form */
    form {
        animation: formRise 0.45s ease-out;
    }
    
    @keyframes formRise {
        0% {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
        }
        100% {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
    
    /* also style the container of comment (django form.comment) nice background transition */
    .mb-3 textarea:not(:placeholder-shown) {
        background-color: #fffef7;
        border-color: #ffda99;
    }
    
    /* make the rating group more accessible and pretty */
    .star-rating label {
        letter-spacing: 2px;
        font-weight: 400;
    }
    
    /* additional hover effect for the whole rating bar background */
    .star-rating:hover {
        background: #fffbf0;
        box-shadow: 0 5px 10px -5px rgba(0,0,0,0.05);
    }
    
    /* Add nice focus ring for accessible rating inputs: but we can't change HTML, but we set focus ring */
    .star-rating input:focus + label {
        outline: 2px solid #ffc107;
        outline-offset: 3px;
        border-radius: 12px;
    }
    
    /* Ensure stars stay visually accessible */
    /* just elegance for the comment section: add subtle bottom line after message? dont alter html */
    /* design for "submit review" button inner content, just extra style for icon feel using pseudo */
    .btn-success {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    /* we add a pseudo element to button that acts like a pen/star, no html change, just design */
    .btn-success::after {
        content: "★";
        font-size: 1.1rem;
        transition: transform 0.2s;
        display: inline-block;
    }
    
    .btn-success:hover::after {
        transform: rotate(8deg) scale(1.1);
    }
    
    /* Adjust text alignment for button and spacing */
    .btn-success {
        letter-spacing: 0.5px;
    }
    
    /* for Django form error handling not present but ensures extra spacing looks fine */
    .errorlist {
        background: #ffe6e6;
        border-radius: 28px;
        font-size: 0.8rem;
        padding: 6px 14px;
        margin-top: 8px;
        color: #b91c1c;
        list-style: none;
    }
    
    /* subtle curve separation between star rating and comment, only visual breathing */
    .star-rating + .mb-3 {
        margin-top: 8px;
    }
    
    /* polish button active ripple effect: */
    .btn-success:active {
        background: linear-gradient(95deg, #1e6b2f, #0f5624);
    }
    
    /* final neatness: rounded corners for comment also inside */
    .mb-3 textarea {
        border-radius: 24px;
    }
    
    /* extra little "recommendation" style: fake shadow for the star rating container? */
    .star-rating:after {
        content: '';
        display: block;
        width: 20%;
        height: 1px;
        background: radial-gradient(ellipse at center, #ffc10730, transparent);
        margin: 8px auto 0;
        border-radius: 4px;
        transition: width 0.2s;
    }
    
    .star-rating:hover:after {
        width: 50%;
    }
    
    /* optional gradient border on focus for entire form to make it pop - modern */
    form:focus-within {
        border-color: transparent;
        box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.2), 0 15px 35px -12px rgba(0,0,0,0.2);
    }
    
    /* small glowing effect on stars when rating chosen - Dynamic but only CSS based on checked */
    .star-rating:has(input:checked) {
        background: #fff7e6;
        transition: 0.2s;
    }
    
    /* additional wavy effect for body background consistency */
    @keyframes slowFloat {
        0% { background-position: 0% 0%; }
        100% { background-position: 10% 5%; }
    }
    
    body {
        animation: slowFloat 18s infinite alternate ease-in-out;
        background-attachment: fixed;
    }
    
    /* ensure the button after element does not break alignment */
    .btn-success::after {
        margin-left: 5px;
        font-size: 1rem;
    }
    
    /* tiny micro animation for the review title */
    h2 {
        transition: background-position 0.3s;
        background-size: 150% auto;
    }
    
    /* finally ensure any third party hidden inputs are not disruptive */
    input[type="hidden"] {
        display: none;
    }
    
    /* elegance detail: rating label receives custom star shape dimm */
    .star-rating label {
        font-family: 'Segoe UI', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    }
    
    /* enhanced shadow for textarea on hover */
    .mb-3 textarea:hover {
        border-color: #cbd5e0;
        background-color: #ffffff;
        box-shadow: 0 6px 12px -8px rgba(0,0,0,0.1);
    }
    
    /* overall improved scroll & readability */
    ::-webkit-scrollbar {
        width: 6px;
    }
    ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
        background: #c1c9d2;
        border-radius: 10px;
    }
    
    /* ensure the button is centered even with pseudo-element */
    .btn-success {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    /* more liveliness: star rating glow on page load for first time? optional. */
    .star-rating label {
        filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05));
    }
    
    /* at last, add extra premium feel to body container */
    body {
        backdrop-filter: blur(0px);
    }
    
    /* keeps original class names & html structure untouched — all enhancements pure CSS */
</style>
<body>
    
<form method="POST">
    <h2>Write a Review for {{ product.name }}</h2>
    {% csrf_token %}

    <div class="star-rating">
        <input type="radio" name="rating" value="5" id="star5">
        <label for="star5">★</label>

        <input type="radio" name="rating" value="4" id="star4">
        <label for="star4">★</label>

        <input type="radio" name="rating" value="3" id="star3">
        <label for="star3">★</label>

        <input type="radio" name="rating" value="2" id="star2">
        <label for="star2">★</label>

        <input type="radio" name="rating" value="1" id="star1">
        <label for="star1">★</label>
    </div>

    <div class="mb-3">
        {{ form.comment }}
    </div>

    <button type="submit" class="btn btn-success">
        Submit Review
    </button>
</form>
</body>
</html>
