<style>
    :root {
  --success-color: #22c55e;
  --error-color: #ef4444;
  --dark-color: #1f2937;
  --text-gray: #6b7280;
  --bg-color: #f9fafb;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: var(--bg-color);
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card-container {
  padding: 20px;
  width: 100%;
  max-width: 450px;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
  border: 1px solid #f3f4f6;
}

.icon-circle {
  width: 80px;
  height: 80px;
  background-color: #f0fdf4;
  color: var(--success-color);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
}

.icon-circle.error {
  background-color: #fef2f2;
  color: var(--error-color);
}

h1 {
  color: var(--dark-color);
  font-size: 24px;
  margin-bottom: 12px;
}

.message {
  color: var(--text-gray);
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 30px;
}

/* Buttons */
.btn {
  display: inline-block;
  text-decoration: none;
  padding: 14px 28px;
  border-radius: 12px;
  font-weight: 600;
  transition: transform 0.2s, background 0.2s;
  cursor: pointer;
  width: 100%;
  box-sizing: border-box;
}

.btn-primary {
  background-color: var(--dark-color);
  color: white;
}

.btn-primary:hover {
  background-color: #000;
  transform: translateY(-2px);
}

.btn-dark {
  background-color: var(--dark-color);
  color: white;
}

.btn-outline {
  background-color: transparent;
  border: 1px solid #d1d5db;
  color: var(--dark-color);
  margin-top: 10px;
}

.button-group {
  display: flex;
  flex-direction: column;
}

/* Details */
.order-id {
  margin-top: 25px;
  font-size: 13px;
  color: #9ca3af;
}

.order-id span {
  font-family: monospace;
  color: var(--text-gray);
}
</style>
<div class="card-container">
  <div class="card success-card">
    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Payment Successful!</h1>
    <p class="message">Your order has been confirmed. You can now access all your premium features from your account.</p>
    
    <a href="{% url 'buyer_dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
    
  </div>
</div>
